server:
  port: 7001

spring:
  application:
    name: cookies-auth
  
  datasource:
    url: jdbc:postgresql://postgres-sessions:5432/postgres-sessions
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  
  data:
    redis:
      host: redis-cache-l2
      port: 6379
  session:
    store-type: redis
  
  jpa:
    hibernate:
      ddl-auto: validate

eureka:
  client:
    service-url:
      defaultZone: http://eureka-admin:${EUREKA_PASSWORD}@eureka-server-grpc-server:8761/eureka

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized

  metrics:
    tags:
      application: ${spring.application.name}

    distribution:
      percentiles-histogram:
        "http.server.requests": true

      percentiles:
        "http.server.requests":
          - 0.99
          - 0.95
          - 0.5