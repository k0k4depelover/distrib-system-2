spring:
  application:
    name: eureka-server
  security:
    user:
      name: eureka-admin
      password: ${EUREKA_PASSWORD}
server:
  port: 8761

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
 

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized