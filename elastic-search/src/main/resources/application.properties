server.port=7003
spring.application.name=elastic-search

#Ruta de guardado local

app.image.storage-path = ${FILE_PATH}
app.images.base-url=${URL}

spring.servlet.multipart.max-file-size= 5MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

spring.servlet.multipart.file-size-threshold=2KB

spring.datasource.url=jdbc:mariadb://mysql-images-metadata-minimum:3306/${MYSQL_DATABASE}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=update
spring.elasticsearch.uris=http://elastic-search:9200
eureka.client.service-url.defaultZone=http://eureka-admin:${EUREKA_PASSWORD}@eureka-server-grpc-server:8761/eureka

management.appoptics.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true


management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99

scheduler.cleanup.cron=0 0 0 * * *

s3.endpoint=http://minio:9000
s3.access-key=${MINIO_ROOT_USER}
s3.secret-key=${MINIO_ROOT_PASSWORD}
s3.bucket=images
s3.region=us-east-1