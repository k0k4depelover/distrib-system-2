server.port=7003
spring.application.name=elastic-search

#Ruta de guardado local

app.image.storage-path = ${FILE_PATH}
app.images.base-url=${URL}

spring.servlet.multipart.max-file-size= 5MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

spring.servlet.multipart.file-size-threshold=2KB

spring.datasource.url=jdbc:mariadb://mariadb:3306/${MYSQL_DATABASE}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.properties.hibernate.dialect= org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=update

eureka.client.service-url.defaultZone=http://eureka-admin:${EUREKA_PASSWORD}@eureka-server-grpc-server:8761/eureka

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true


management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99