networks:
  private-net:
    driver: bridge
  public-net:
    driver: bridge

services:

  eureka-server-grpc-server:
    container_name: eureka-server-grpc-server-minimum
    networks:
      - private-net
    build: ./eureka-server

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://localhost:8761/actuator/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 30


  api-gateway:
    container_name: api-gateway-minimum
    networks:
      - private-net
      - public-net
    build: ./api-gateway
    ports:
      - "7000:7000"

    depends_on:
      eureka-server-grpc-server:
        condition: service_healthy

    environment:
      - eureka.client.service-url.defaultZone=http://eureka-server-grpc-server:8761/eureka


  session-stateful-server:
    container_name: session-stateful-server-minimum
    networks:
      - private-net
    build: ./cookies-auth
    expose:
      - "7001"

    depends_on:
      eureka-server-grpc-server:
        condition: service_healthy
      postgres:
        condition: service_healthy

    environment:
      - eureka.client.service-url.defaultZone=http://eureka-server-grpc-server:8761/eureka

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://localhost:7001/actuator/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 30




  web-socket-chat:
    container_name: web-socket-chat-minimum
    networks:
      - private-net
      - public-net
    build: ./chat
    ports:
      - "7002:7002"

    depends_on:
      eureka-server-grpc-server:
        condition: service_healthy

    environment:
      - eureka.client.service-url.defaultZone=http://eureka-server-grpc-server:8761/eureka


  elastic-search-server:
    container_name: elastic-server
    networks:
      - private-net
    build: ./elastic-search
    expose:
      - "7003"

    depends_on:
      eureka-server-grpc-server:
        condition: service_healthy
      elastic-search:
        condition: service_healthy

    environment:
      - eureka.client.service-url.defaultZone=http://eureka-server-grpc-server:8761/eureka

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://localhost:7003/actuator/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 30



  redis-rl:
    image: redis:alpine
    container_name: redis-rate-limiter-minimum
    networks:
      - private-net
    volumes:
      - redis-rl:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10



  redis-l2:
    image: redis:alpine
    container_name: redis-cache-l2-minimum
    networks:
      - private-net
    volumes:
      - redis-cache-l2:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10



  postgres:
    image: postgres:16-alpine
    container_name: postgres-sessions-minimum

    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

    networks:
      - private-net

    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
      - postgres-sessions:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10




  elastic-search:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: elastic-search-minimum

    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"

    networks:
      - private-net

    volumes:
      - es_data:/usr/share/elasticsearch/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://localhost:9200/_cluster/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 30



  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: kibana-minimum
    networks:
      - private-net
      - public-net
    ports:
      - "5601:5601"

    depends_on:
      elastic-search:
        condition: service_healthy

    environment:
      - ELASTICSEARCH_HOSTS=http://elastic-search:9200


  mariadb:
    image: mariadb
    container_name: mysql-images-metadata-minimum

    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}

    networks:
      - private-net

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb-admin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD} --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus
    container_name: prometheus_minimum
    networks:
      - private-net
    volumes:
      - /.prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command: 
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    expose:
      - 9090
  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana_minimum
    networks:
      - private-net
      - public-net
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro


volumes:
  es_data:
  redis-rl:
  redis-cache-l2:
  postgres-sessions:
  mysql-data:
  prometheus-data:
  grafana-data: